# 開発用: PostgreSQL（本番は Patroni）。兄弟の開発環境と同時に動かせるよう、ポートをずらしている
# メールの通知を試すときは、兄弟の Mailpit（skereru: localhost:1032、stui: localhost:1027）か skereru の submission を SMTP_HOST に指定する
name: smohua
services:
  db:
    image: groonga/pgroonga:4.1.0-alpine-17-slim   # 兄弟と同じイメージ（PGroonga は使っていない）
    environment:
      POSTGRES_USER: smohua
      POSTGRES_PASSWORD: smohua
      POSTGRES_DB: smohua
    ports: ["127.0.0.1:54398:5432"]   # 開発用のパスワードなので、このマシンの中からだけ
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-smohua-test.sql:ro   # テスト用DB smohua_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "smohua"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
